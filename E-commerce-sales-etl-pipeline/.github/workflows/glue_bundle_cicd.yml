name: Glue Bundle CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'glue_bundle/**'
      - 'enterprise_pipeline/**'
      - 'github/**'
      - '.github/workflows/glue_bundle_cicd.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: us-east-1
      S3_BUCKET: ${{ secrets.GLUE_DEPLOY_BUCKET }}
      S3_PREFIX: glue-bundles
      ZIP_NAME: ecommerce_etl_glue_bundle.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build clean Glue zip
        shell: bash
        run: |
          chmod +x ./enterprise_pipeline/github/ci/build_glue_bundle.sh
          ZIP_NAME="${ZIP_NAME}" ./enterprise_pipeline/github/ci/build_glue_bundle.sh

      - name: Deploy bundle to S3 and trigger Glue jobs
        shell: bash
        env:
          GLUE_DEPLOY_BUCKET: ${{ secrets.GLUE_DEPLOY_BUCKET }}
          BRONZE_GLUE_JOB_NAME: ${{ secrets.BRONZE_GLUE_JOB_NAME }}
          SILVER_GLUE_JOB_NAME: ${{ secrets.SILVER_GLUE_JOB_NAME }}
          BUNDLE_PATH: ./enterprise_pipeline/glue_bundle/dist/${{ env.ZIP_NAME }}
        run: |
          chmod +x ./enterprise_pipeline/github/cd/deploy_to_aws.sh
          ./enterprise_pipeline/github/cd/deploy_to_aws.sh
