## Simple auto-deploy for E-commerce app
## Requirements:
## - Secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, AWS_GLUE_SCRIPTS_BUCKET, BRONZE_GLUE_JOB_NAME (optional)
## - Ensure these scripts exist and are executable if present:
##     ./enterprise_pipeline/github/ci/build_glue_bundle.sh
##     ./enterprise_pipeline/github/cd/deploy_to_aws.sh

name: Deploy E-commerce to AWS

on:
  push:
    branches:
      - main
      - e-commerce-sales-etl-app
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4

        # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      # 3. Install dependencies
      - name: Install dependencies
        run: |
          pip install boto3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build Glue bundle (if script exists)
        # Upload Glue code to S3

        run: |
          cd SRC

          zip -r ../glue_code.zip . \
            -x "*/__pycache__/*" "*.pyc"

          aws s3 cp \
            ../glue_code.zip \
            s3://${{ secrets.AWS_GLUE_SCRIPTS_BUCKET }}/e-commerce-code/glue_code/glue_code.zip
        

      - name: Done
        run: echo "Deployment workflow completed"
